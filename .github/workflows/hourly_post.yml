name: Twice-daily Korean Phrase Auto-Post

on:
  schedule:
    # 18:37 / 21:37 JST (UTC 09:37 / 12:37). SNS 이용이 많은 저녁 시간대. 정각은 스케줄이 몰려 누락되기 쉬워 37분을 유지한다.
    - cron: "37 9,12 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: write # 게시 상태(data/phrases.json)를 커밋하기 위해 필요

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run posting job
        env:
          HOMEPAGE_URL: ${{ secrets.HOMEPAGE_URL }}
          ENABLE_TWITTER: ${{ secrets.ENABLE_TWITTER }}
          ENABLE_THREADS: ${{ secrets.ENABLE_THREADS }}
          ENABLE_LINE: ${{ secrets.ENABLE_LINE }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python run_once.py

      - name: Commit updated phrase database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/phrases.json
          if git diff --cached --quiet; then
            echo "게시 상태에 변경이 없어 커밋을 생략합니다."
            exit 0
          fi
          git commit -m "chore: update phrase publish status [skip ci]"
          # 스케줄이 지연되면 오래된 커밋 위에서 실행될 수 있어, 푸시 전에 원격 커밋을 먼저 취합한다
          git pull --rebase origin main
          git push
